<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 WebRTC Security Live Stream</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h2 { margin-bottom: 10px; color: #00ffcc; }
        #video-container { width: 100%; max-width: 640px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h2>🔴 Live Security Stream</h2>
    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline muted controls></video>
    </div>
    <div class="status" id="status">Connecting to ESP32 device...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const statusDiv = document.getElementById('status');

        if (!roomId) {
            statusDiv.innerText = "Error: Invalid or Missing Room ID!";
        } else {
            statusDiv.innerText = "Connecting to Device Room: " + roomId;
            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            });

            pc.ontrack = (event) => {
                const videoElem = document.getElementById('remoteVideo');
                videoElem.srcObject = event.streams[0];
                videoElem.play().catch(e => console.log("Autoplay blocked:", e));
                statusDiv.innerText = "Connected! Live video playing.";
            };

            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                    statusDiv.innerText = "Connection lost or blocked by firewall.";
                }
            };
        }
    </script>
</body>
</html>
