<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Live Security Stream</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h2 { margin-bottom: 10px; color: #00ffcc; }
        #video-container { width: 100%; max-width: 640px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; height: auto; display: block; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h2>🔴 Live Security Stream</h2>
    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline muted controls></video>
    </div>
    <div class="status" id="status">Connecting to ESP32 device...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const statusDiv = document.getElementById('status');

        if (!roomId) {
            statusDiv.innerText = "Error: Invalid or Missing Room ID!";
        } else {
            statusDiv.innerText = "Connecting to Device Room: " + roomId;
            
            // PeerJS client initialization
            const peer = new Peer();

            peer.on('open', (id) => {
                console.log('My Peer ID:', id);
                // Connect to ESP32 camera peer
                const conn = peer.connect(roomId);
                
                conn.on('open', () => {
                    statusDiv.innerText = "Signaling connected. Requesting Stream...";
                });
            });

            peer.on('call', (call) => {
                call.answer(); // Answer incoming video call from ESP32
                call.on('stream', (remoteStream) => {
                    const videoElem = document.getElementById('remoteVideo');
                    videoElem.srcObject = remoteStream;
                    videoElem.play();
                    statusDiv.innerText = "Connected! Live video playing.";
                });
            });

            peer.on('error', (err) => {
                statusDiv.innerText = "Connection Error: " + err.type;
            });
        }
    </script>
</body>
</html>
